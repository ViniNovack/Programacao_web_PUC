<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
    <link rel="stylesheet" href="./tabela.css">
</head>
<body>
    
    <div class="container">
        <table class="tabela">
            <thead class="tabela-cabesario">
                <tr>
                    <th>id</th>
                    <th>nome</th>
                    <th>descricao</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo" class="tabela-corpo">

            </tbody>
        </table>
    </div>

    <button id="botao" class="botao">MENU</button>
    
    <script src="./tabela.js" defer></script>
</body>
</html>
