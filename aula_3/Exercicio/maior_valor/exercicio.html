<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>site_exercicio</title>
    <link rel="stylesheet" href="./exercicio.css">
</head>
<body>
    <label>Digite os valores:</label>

    <form id="analizar">
        <div class="blocao">
            <input id="primeiro_numero" class="bloco" type="number" placeholder="Digite o primeiro número">
            <input id="segundo_numero" class="bloco" type="number" placeholder="Digite o segundo número">
            <div>
                <button id="botao" class="botao" type="button">Analizar</button>
                <button id="voltar" class="botao" type="button">Voltar</button>
                <button id="limpar" class="botao" type="button">Limpar</button>
            </div>
            <div id="caixa_resultado" class="resultado escondido">
                <p id="resultado"></p>
            </div>
        </div>
    </form>
    
    <script src="./exercicio.js" defer></script>
</body>
</html>
