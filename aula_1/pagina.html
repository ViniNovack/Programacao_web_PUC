<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro site</title>
</head>
<body>
    <h1>Formulario</h1>
    <h2>Nome:</h2>
        <input type="Text" placeholder="Digite seu nome">
    <h2>e-mail:</h2>
        <input type="Email" placeholder="Digite seu email">
    <h2>CPF:</h2>
        <input type="number" placeholder="Digite seu CPF">
    <h2>Idade:</h2>
        <input type="Idade" placeholder="Digite sua Idade">
    <h2>Altura:</h2>
        <input type="number" placeholder="Digite sua altura">
    <h2>O quanto você gosta de computação?</h2>
        <input type="range" min="0" max="100">
    <h2>Qual é seu sexo?</h2>
        <input type="radio" id="sexo-m" name="sexo" value="M">
            <label for="sexo-m">M</label>
        <input type="radio" id="sexo-f" name="sexo" value="F">
            <label for="sexo-f">F</label>
    <h2>Você gosta mais de qual super heroi?</h2>
    <img src="https://estadodaarte.estadao.com.br/wp-content/uploads/2024/11/Marvel-vs.-DC-integra-1024x1024.png">
        <br><br><select required>
            <option disabled selected>Selecione uma opção</option>
            <option>Superman</option>
            <option>Batman</option>
            <option>Homem-Aranha</option>
            <option>Capitão-America</option>
        </select>
    <h2>O que você mais gosta de fazer nas seguintes atividades:</h2>
        <input type="checkbox">
            <label>Musica</label>
        <input type="checkbox">
            <label>Jogar</label>
        <input type="checkbox">
            <label>Esportes</label>
        <input type="checkbox">
            <label>Ler</label>
</body>
</html>
